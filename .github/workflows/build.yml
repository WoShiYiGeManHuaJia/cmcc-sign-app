name: build-apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Push APK back
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cmcc-sign.apk
          git config user.email "bot@example.com"
          git config user.name "apk-bot"
          git add -f cmcc-sign.apk
          git commit -m "apk" || echo "no change"
          git push
